# Traefik IngressRoutes. TLS is terminated at Traefik (10.3.3.12)
# using wildcard certs from the `letsencrypt` Cloudflare DNS-01 resolver.
# HTTP on port 80 is redirected globally in HelmChartConfig, so only
# `websecure` is listed here.
#
# Requires Traefik CRDs (bundled with k3s): apiVersion traefik.io/v1alpha1.
# If your k3s is old (Traefik v2), change to traefik.containo.us/v1alpha1.

# --- *.mseung.dev -> 10.3.3.218:80 ---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wildcard-mseung-dev
  namespace: web-proxy
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostRegexp(`.+\.mseung\.dev`) || Host(`mseung.dev`)
      kind: Rule
      services:
        - name: lan-218-http
          port: 80
          # passHostHeader defaults to true - required so the downstream
          # proxy on .218 can vhost-route.
  tls:
    certResolver: letsencrypt
    domains:
      - main: mseung.dev
        sans:
          - "*.mseung.dev"
---
# --- *.seung.dev -> 10.3.3.218:80 ---
