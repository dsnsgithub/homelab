# Traefik IngressRoutes. TLS is terminated at Traefik (10.3.3.12, 2 replicas)
# using wildcard cert Secrets issued by cert-manager (see certificates.yaml).
# HTTP on port 80 is redirected globally in Traefik values, so only
# `websecure` is listed here.

# --- *.mseung.dev -> 10.3.3.218:80 ---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wildcard-mseung-dev
  namespace: web-proxy
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostRegexp(`.+\.mseung\.dev`) || Host(`mseung.dev`)
      kind: Rule
      services:
        - name: lan-218-http
          port: 80
          # passHostHeader defaults to true - required so the downstream
          # proxy on .218 can vhost-route.
  tls:
    secretName: mseung-wildcard-tls
---
# --- *.seung.dev -> 10.3.3.218:80 ---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wildcard-seung-dev
  namespace: web-proxy
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostRegexp(`.+\.seung\.dev`) || Host(`seung.dev`)
      kind: Rule
      services:
        - name: lan-218-http
          port: 80
  tls:
    secretName: seung-wildcard-tls
---
