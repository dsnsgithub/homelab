# External backends from the screenshot, modelled as selector-less
# Services + manual Endpoints. Traefik terminates TLS and forwards plain HTTP.
#
#  *.mseung.dev            -> http://10.3.3.218:80
#  *.seung.dev             -> http://10.3.3.218:80
#  code.dsns.dev           -> http://10.3.3.195:7799
#  immich.dsns.dev         -> http://10.3.3.172:2283
#  vray.dsns.dev           -> v2ray-service.v2ray-vpn:10086 (in-cluster, see below)

# --- Shared LAN backend 10.3.3.218:80 (likely another reverse proxy, e.g. NPM) ---
apiVersion: v1
kind: Service
metadata:
  name: lan-218-http
  namespace: web-proxy
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: lan-218-http
  namespace: web-proxy
subsets:
  - addresses:
      - ip: 10.3.3.218
    ports:
      - name: http
        port: 80
        protocol: TCP

---
# --- code.dsns.dev -> 10.3.3.195:7799 ---
apiVersion: v1
kind: Service
metadata:
  name: code
  namespace: web-proxy
spec:
  ports:
    - name: http
      port: 7799
      targetPort: 7799
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: code
  namespace: web-proxy
subsets:
  - addresses:
      - ip: 10.3.3.195
    ports:
      - name: http
        port: 7799
        protocol: TCP

---
# --- immich.dsns.dev -> 10.3.3.172:2283 ---
apiVersion: v1
kind: Service
metadata:
  name: immich
  namespace: web-proxy
spec:
  ports:
    - name: http
      port: 2283
      targetPort: 2283
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: immich
  namespace: web-proxy
subsets:
  - addresses:
      - ip: 10.3.3.172
    ports:
      - name: http
        port: 2283
        protocol: TCP

---
# --- vray.dsns.dev -> in-cluster v2ray-service (10.3.3.11:10086 externally) ---
# ExternalName avoids hairpinning through the .11 VIP and avoids
# cross-namespace IngressRoute service references.
apiVersion: v1
kind: Service
metadata:
  name: vray
  namespace: web-proxy
spec:
  type: ExternalName
  externalName: v2ray-service.v2ray-vpn.svc.cluster.local
  ports:
    - name: http
      port: 10086
      targetPort: 10086
      protocol: TCP
