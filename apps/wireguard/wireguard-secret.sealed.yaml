# PLACEHOLDER - not a real ciphertext. Generate the real object before the
# first sync (see wireguard-secret.TEMPLATE.yaml), otherwise the Sealed
# Secrets controller cannot decrypt it, the Deployment has an unmet secret
# reference, and the Pod never starts. The base64 below only decodes to the
# ASCII string "REPLACE_ME" so that kustomize/kubectl parse this file
# cleanly until it is replaced.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wgeasy-auth
  namespace: wireguard-vpn
spec:
  encryptedData:
    admin-password: UkVQTEFDRV9NRQ==
  template:
    metadata:
      name: wgeasy-auth
      namespace: wireguard-vpn
    type: Opaque
