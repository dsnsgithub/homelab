# PLACEHOLDER - not a real ciphertext. Generate the real object before the
# first sync, otherwise the Sealed Secrets controller cannot decrypt it and
# the wireguard Pod stays Pending (expected one-time onboarding, same flow
# as the v2ray/minecraft secrets in docs/bootstrap.md):
#
#   ./apps/wireguard/gen-wireguard-secret.sh --peers laptop,phone
#
# which writes the sealed output to this exact path. The base64 below only
# decodes to the ASCII string "REPLACE_ME" so that kustomize/kubectl parse
# this file cleanly until it is replaced.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wireguard-config
  namespace: wireguard-vpn
spec:
  encryptedData:
    wg0.conf: UkVQTEFDRV9NRQ==
  template:
    metadata:
      name: wireguard-config
      namespace: wireguard-vpn
    type: Opaque
