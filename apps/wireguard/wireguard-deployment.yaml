# wg-easy (v15) WireGuard server with web UI for peer management.
#
# This is intentionally STATEFUL: wg-easy keeps its SQLite database, server
# keys and peer configs under /etc/wireguard, served here by a 1Gi
# local-path PVC (see infra via argocd/apps/local-path-provisioner-app.yaml).
# Peer management happens in the web UI, not in Git.
#
# Design notes (read before changing):
# - replicas MUST stay 1 with strategy Recreate. The PVC is ReadWriteOnce
#   and two pods would share one server key/IP while UDP has no session
#   affinity.
# - v15 removed almost all WG_* env vars. First boot is configured via the
#   INIT_* vars below (used ONLY on first start against an empty volume);
#   afterwards everything is managed in the UI. Changing INIT_* later has
#   no effect unless the PVC is deleted (which wipes all peers).
# - INSECURE=true because the UI is served over plain HTTP on a ClusterIP
#   and reached via kubectl port-forward (see docs/operations.md). If the
#   UI is ever put behind Traefik HTTPS, drop INSECURE.
# - NET_ADMIN + SYS_MODULE mirror the official wg-easy Kubernetes guide.
#   SYS_MODULE is belt-and-braces: Talos already loads the WireGuard module
#   (KubeSpan uses it).
# - No pod-level sysctls on purpose. The upstream guides set
#   net.ipv4.conf.all.src_valid_mark=1 / net.ipv4.ip_forward=1, but those
#   are unsafe sysctls Talos kubelets reject by default (ip_forward is
#   already 1 on Talos nodes for the CNI). If the tunnel comes up but peers
#   get no traffic, allow-listing the unsafe sysctls via the Talos machine
#   config is the first thing to try.
# - Probes are tcpSocket against the UI port, as in the upstream guide;
#   WireGuard itself is UDP with no handshake until the first peer connects.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: wireguard-vpn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
    spec:
      containers:
      - name: wg-easy
        image: ghcr.io/wg-easy/wg-easy:15
        env:
        - name: INSECURE
          value: "true"
        - name: PORT
          value: "51821"
        - name: HOST
          value: "0.0.0.0"
        # First-boot only (empty volume). See header comment.
        - name: INIT_ENABLED
          value: "true"
        - name: INIT_USERNAME
          value: "admin"
        - name: INIT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wgeasy-auth
              key: admin-password
        - name: INIT_HOST
          value: "10.3.3.11"
        - name: INIT_PORT
          value: "51820"
        - name: INIT_DNS
          value: "10.96.0.10,1.1.1.1"
        - name: INIT_IPV4_CIDR
          value: "10.13.13.0/24"
        - name: INIT_IPV6_CIDR
          value: "fd13:13:13::/64"
        - name: INIT_ALLOWED_IPS
          value: "10.13.13.0/24,10.3.3.0/24,10.244.0.0/16,10.96.0.0/12"
        ports:
        - containerPort: 51820
          protocol: UDP
          name: wireguard
        - containerPort: 51821
          protocol: TCP
          name: ui
        readinessProbe:
          tcpSocket:
            port: ui
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: ui
          initialDelaySeconds: 30
          periodSeconds: 20
        volumeMounts:
        - name: data
          mountPath: /etc/wireguard
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - SYS_MODULE
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: wgeasy-data
