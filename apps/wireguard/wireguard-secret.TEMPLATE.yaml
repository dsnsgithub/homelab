# Template only - DO NOT commit a real secret here.
#
# Generate keys and seal in one step (needs wireguard-tools, kubectl, kubeseal):
#   ./apps/wireguard/gen-wireguard-secret.sh --peers laptop,phone
#
# Or seal a hand-edited file (same kubeseal flow as v2ray/minecraft):
#   kubeseal --format yaml --controller-name sealed-secrets-controller --controller-namespace kube-system \
#     < apps/wireguard/wireguard-secret.plain.yaml > apps/wireguard/wireguard-secret.sealed.yaml
#
# Server identity lives entirely in this one key. The initContainer copies
# wg0.conf into an in-memory emptyDir at Pod start; nothing is ever written
# to persistent storage. Rotating the server key invalidates every peer, so
# generate it once and keep the peer .conf files (apps/wireguard/.peers/,
# gitignored) backed up offline.
#
# Network plan (defaults from the generator script, override with flags):
# - Server: 10.13.13.1/24. Peers get 10.13.13.2/32, .3/32, ... sequentially.
#   10.13.13.0/24 was chosen to avoid 10.3.3.0/24 (LAN), 10.244.0.0/16
#   (Talos pod CIDR) and 10.96.0.0/12 (Talos service CIDR).
# - Peer AllowedIPs are /32 host routes: peers can only BE that one VPN IP,
#   they cannot spoof each other.
# - Client DNS defaults to the cluster CoreDNS (10.96.0.10) with 1.1.1.1
#   fallback, so cluster.local names resolve over the VPN.
# - Client AllowedIPs default to a split tunnel (LAN + pod + service CIDRs
#   only). For a full tunnel, change the peer .conf to 0.0.0.0/0, ::/0.
# - PersistentKeepalive = 25 keeps NAT mappings open for peers behind NAT.
#   The server is directly reachable, so it needs no keepalive of its own.
# - PostUp/PostDown MASQUERADE peer traffic behind the Pod IP so return
#   traffic routes back without any static routes on the LAN.
#
# Adding a peer later: re-run the generator with the FULL peer list
# (it reuses the existing server key), reseal, push. Client .conf files are
# never committed.

apiVersion: v1
kind: Secret
metadata:
  name: wireguard-config
  namespace: wireguard-vpn
type: Opaque
stringData:
  wg0.conf: |
    [Interface]
    Address = 10.13.13.1/24
    ListenPort = 51820
    PrivateKey = REPLACE_ME_SERVER_PRIVATE_KEY
    MTU = 1420
    PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
    PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

    # No peers yet. Example peer entries (uncomment and fill, or preferably
    # generate with gen-wireguard-secret.sh which also emits the client side):
    #
    # [Peer]
    # # laptop - 10.13.13.2/32
    # PublicKey = REPLACE_ME_PEER_LAPTOP_PUBLIC_KEY
    # PresharedKey = REPLACE_ME_PEER_LAPTOP_PRESHARED_KEY
    # AllowedIPs = 10.13.13.2/32
    # PersistentKeepalive = 25
    #
    # [Peer]
    # # phone - 10.13.13.3/32
    # PublicKey = REPLACE_ME_PEER_PHONE_PUBLIC_KEY
    # PresharedKey = REPLACE_ME_PEER_PHONE_PRESHARED_KEY
    # AllowedIPs = 10.13.13.3/32
    # PersistentKeepalive = 25
