# Template only - DO NOT commit a real secret here.
#
# Generate a password and seal it (same kubeseal flow as v2ray/minecraft):
#
#   ADMIN_PASSWORD="$(openssl rand -base64 24)"
#   echo "save this somewhere offline: $ADMIN_PASSWORD"
#   kubectl create secret generic wgeasy-auth -n wireguard-vpn \
#     --from-literal=admin-password="$ADMIN_PASSWORD" \
#     --dry-run=client -o yaml > apps/wireguard/wireguard-secret.plain.yaml
#   kubeseal --format yaml --controller-name sealed-secrets-controller --controller-namespace kube-system \
#     < apps/wireguard/wireguard-secret.plain.yaml > apps/wireguard/wireguard-secret.sealed.yaml
#
# The password seeds the wg-easy admin account on FIRST boot only (INIT_*
# vars are ignored once /etc/wireguard holds a database). Rotating it
# afterwards happens in the web UI, not here.

apiVersion: v1
kind: Secret
metadata:
  name: wgeasy-auth
  namespace: wireguard-vpn
type: Opaque
stringData:
  admin-password: REPLACE_ME_WGEASY_ADMIN_PASSWORD
