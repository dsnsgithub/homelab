# Postgres with the vectorchord (vchord) extension, following the official
# example at https://github.com/immich-app/immich-charts/blob/main/local/cloudnative-pg.yaml
#
# Requires the CNPG operator (argocd/apps/cloudnative-pg-app.yaml).
# CNPG auto-creates a secret named <cluster>-app (here: immich-database-app)
# with keys host/user/password/dbname, which infra/immich/values.yaml consumes.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  namespace: immich
spec:
  instances: 1

  storage:
    storageClass: local-path
    size: 50Gi

  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie

  postgresql:
    shared_preload_libraries:
      - "vchord.so"

    # This extension image is loaded via the Database CR at postgres-database.yaml
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
