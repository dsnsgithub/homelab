apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: t3-data
  namespace: t3-code
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: t3-repos
  namespace: t3-code
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
