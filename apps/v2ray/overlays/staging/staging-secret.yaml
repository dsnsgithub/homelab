apiVersion: v1
kind: Secret
metadata:
  # No namespace on purpose: the ArgoCD ApplicationSet's
  # destination.namespace supplies the per-PR/per-branch staging namespace.
  # Same object name as prod so the Deployment mounts it without changes.
  name: v2ray-config
  annotations:
    homelab.dsns.dev/env: staging
type: Opaque
stringData:
  # Minimal STAGING config with a dummy client ID — just enough for the pod
  # to start. Shape mirrors apps/v2ray/v2ray-secret.TEMPLATE.yaml.
  # SealedSecrets are strict-scoped (bound to name+namespace), so the prod
  # SealedSecret can NOT decrypt in a staging namespace. If a staging env
  # needs real credentials, re-seal them for that namespace, e.g.:
  #   kubeseal --format yaml --controller-name sealed-secrets-controller \
  #     --controller-namespace kube-system --scope namespace-wide \
  #     < v2ray-secret.plain.yaml > staging-secret.sealed.yaml
  config.json: |
    {
      "dns": {
        "servers": [
          "https://dns.adguard.com"
        ]
      },
      "inbounds": [
        {
          "port": 10086,
          "protocol": "vmess",
          "settings": {
            "clients": [
              {
                "alterId": 64,
                "id": "00000000-0000-0000-0000-000000000000"
              }
            ]
          },
          "streamSettings": {
            "network": "ws",
            "security": "none",
            "wsSettings": {
              "path": "/dsns"
            }
          }
        }
      ],
      "outbounds": [
        {
          "protocol": "freedom",
          "settings": {}
        }
      ]
    }
