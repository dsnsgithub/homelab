apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared workloads. Referenced by ../kustomization.yaml (prod) and by
# overlays/staging/kustomization.yaml (ephemeral staging). Keep this base
# free of environment-specific state: no Namespace objects, no Secrets —
# those are added by the root (prod) or the overlay (staging).
resources:
  - v2ray-deployment.yaml
  - v2ray-service.yaml
