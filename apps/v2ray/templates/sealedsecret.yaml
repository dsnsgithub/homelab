# Sealed secret for the V2Ray client UUID.
# Re-seal after a fresh cluster install (controller certificate changes):
#   kubeseal --format yaml --controller-name sealed-secrets-controller --controller-namespace kube-system < apps/v2ray/v2ray-secret.plain.yaml > apps/v2ray/templates/sealedsecret.yaml
# See apps/v2ray/v2ray-secret.TEMPLATE.yaml for the plain input shape.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: v2ray-id
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  labels:
    {{- include "v2ray.labels" . | nindent 4 }}
spec:
  encryptedData:
    id: 
  template:
    metadata:
      name: v2ray-id
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
    type: Opaque
