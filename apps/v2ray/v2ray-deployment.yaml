apiVersion: apps/v1
kind: Deployment
metadata:
  name: v2ray
  namespace: v2ray-vpn
spec:
  replicas: 2
  selector:
    matchLabels:
      app: v2ray
  template:
    metadata:
      labels:
        app: v2ray
    spec:
      containers:
      - name: v2ray
        image: v2fly/v2fly-core
        volumeMounts:
        - name: v2ray-config
          mountPath: /etc/v2ray/config.json
          subPath: config.json
        stdin: true
        tty: true
      volumes:
      - name: v2ray-config
        secret:
          secretName: v2ray-config
          items:
          - key: config.json
            path: config.json
