apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base
  - namespace.yaml
  - v2ray-secret.sealed.yaml

# NOTE: v2ray-secret.TEMPLATE.yaml is intentionally NOT listed here.
# It is documentation only (placeholder values). Previously this directory
# had no kustomization, so ArgoCD's plain-directory mode applied every YAML
# file in it — including the TEMPLATE Secret, which fights the SealedSecret
# for the same v2ray-config name. Listing resources explicitly fixes that.
