---
# STALE - re-seal before applying (see v2ray-secret.TEMPLATE.yaml). To keep the current client ID:
# kubectl get secret v2ray-config -n v2ray-vpn -o jsonpath="{.data.config\.json}" | base64 -d | python3 -c "import json,sys; print(json.load(sys.stdin)['inbounds'][0]['settings']['clients'][0]['id'], end='')" > ./v2ray-id
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: v2ray-id
  namespace: v2ray-vpn
spec:
  encryptedData:
    id: REPLACE_ME_RESEAL_WITH_KUBESEAL
  template:
    metadata:
      name: v2ray-id
      namespace: v2ray-vpn
    type: Opaque
