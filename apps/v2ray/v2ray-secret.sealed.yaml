---
# STALE PLACEHOLDER - re-seal before applying. The previous sealed object
# encrypted the whole config.json; only the client id is sealed now, so this
# must be regenerated (see v2ray-secret.TEMPLATE.yaml):
#
# kubectl create secret generic v2ray-id -n v2ray-vpn \
#   --from-file=id=./v2ray-id \
#   --dry-run=client -o yaml | kubeseal --format yaml --controller-name sealed-secrets-controller --controller-namespace kube-system > apps/v2ray/v2ray-secret.sealed.yaml
#
# Migrating without changing the client ID: extract it from the live cluster
# first, then seal that value:
#
# kubectl get secret v2ray-config -n v2ray-vpn -o jsonpath="{.data.config\.json}" \
#   | base64 -d | python3 -c "import json,sys; print(json.load(sys.stdin)['inbounds'][0]['settings']['clients'][0]['id'], end='')" > ./v2ray-id
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: v2ray-id
  namespace: v2ray-vpn
spec:
  encryptedData:
    id: REPLACE_ME_RESEAL_WITH_KUBESEAL
  template:
    metadata:
      name: v2ray-id
      namespace: v2ray-vpn
    type: Opaque
