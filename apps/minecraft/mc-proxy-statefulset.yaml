# Single manifest for both proxies. Ordinal 0/1 gives each pod a stable
# identity (mc-proxy-0/1), so per-pod Services can pin VIP .11/.12 and the
# preStop hook can compute its peer from $HOSTNAME. Edit once, both get it.
#
# Bonus over two Deployments: StatefulSet rolls pods one at a time in order,
# so config/image updates serialize for free (no sync-wave annotations) and
# need no surge capacity beyond the two nodes.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mc-proxy
  namespace: minecraft
spec:
  serviceName: mc-proxy
  replicas: 2
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: mc-proxy
  template:
    metadata:
      labels:
        app: mc-proxy
    spec:
      # Never co-locate the two proxies: draining one node must leave the peer alive.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: mc-proxy
            topologyKey: kubernetes.io/hostname
      # Transfer window: RCON move + client re-handshake to the peer before SIGTERM/SIGKILL.
      terminationGracePeriodSeconds: 90
      initContainers:
      - name: init-configs
        image: busybox:latest
        command: ['sh', '-c', 'cp /config-source/velocity.toml /server/velocity.toml && cp /config-source/forwarding.secret /server/forwarding.secret']
        volumeMounts:
        - name: server-data
          mountPath: /server
        - name: config-source
          mountPath: /config-source
      containers:
      - name: proxy
        image: itzg/mc-proxy:java25
        env:
        - name: TYPE
          value: "VELOCITY"
        - name: MINECRAFT_VERSION
          value: "26.2"
        - name: MODRINTH_PROJECTS
          value: |
            velocity-limbo-handler
            simple-voice-chat:alpha
            velocitytransfer
        - name: ENABLE_RCON
          value: "true"
        - name: RCON_PORT
          value: "25575"
        - name: RCON_PASSWORD
          valueFrom:
            secretKeyRef:
              name: velocity-config
              key: rcon-password
              # Allows rollout before you reseal the secret with the new key;
              # transfer just degrades until the reseal (see TEMPLATE comment).
              optional: true
        # Stable peer entrypoint host. Port is derived from the pod ordinal in
        # preStop below. Must be reachable by every client (LAN + WAN).
        # Assumes mc.dsns.dev resolves internally and externally, with router
        # forwards WAN:25565 -> 10.3.3.11:25565 and WAN:25566 -> 10.3.3.12:25565.
        - name: PEER_HOST
          value: "mc.dsns.dev"
        ports:
        - containerPort: 25577
          name: velocity
        - containerPort: 25577
          protocol: UDP
          name: voice-chat
        - containerPort: 25575
          name: rcon
        volumeMounts:
        - name: server-data
          mountPath: /server
        stdin: true
        tty: true
        readinessProbe:
          tcpSocket:
            port: 25577
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              # Move every player to the surviving proxy via the Transfer packet
              # (1.20.5+ clients see a loading screen, no manual rejoin), then
              # hold the pod so clients finish the new handshake before SIGTERM.
              # `|| true` keeps termination moving when RCON has no players to move.
              command: ['sh', '-c', 'ORD="${HOSTNAME##*-}"; if [ "$ORD" = "0" ]; then PEER_PORT=25566; else PEER_PORT=25565; fi; rcon-cli transfer "$PEER_HOST:$PEER_PORT" all || true; sleep 20']
      volumes:
      - name: server-data
        emptyDir: {}
      - name: config-source
        secret:
          secretName: velocity-config
