# Template only - DO NOT commit a real secret here.

# Only the actual forwarding secret is sealed. velocity.toml and server.toml
# live in plaintext in velocity-configmap.yaml.

# Command:
# kubectl create secret generic velocity-forwarding-secret -n minecraft \
#   --from-file=forwarding.secret=./forwarding.secret \
#   --dry-run=client -o yaml | kubeseal --format yaml --controller-name sealed-secrets-controller --controller-namespace kube-system > apps/minecraft/velocity-secret.sealed.yaml

# Replace REPLACE_ME_VELOCITY_FORWARDING_SECRET with a generated Velocity proxy
# forwarding secret. That same value reaches both sides from this single key:
# the proxy reads it as a file, and Limbo gets it via the
# VELOCITY_FORWARDING_SECRET env var (see limbo-deployment.yaml).

apiVersion: v1
kind: Secret
metadata:
  name: velocity-forwarding-secret
  namespace: minecraft
type: Opaque
stringData:
  forwarding.secret: |
    REPLACE_ME_VELOCITY_FORWARDING_SECRET
