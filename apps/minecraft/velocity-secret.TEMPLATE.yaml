# Template only - DO NOT commit a real secret here.

# Command:
# kubeseal --format yaml --controller-name sealed-secrets-controller --controller-namespace kube-system < apps/minecraft/velocity-secret.plain.yaml > apps/minecraft/velocity-secret.sealed.yaml

# Replace every REPLACE_ME_VELOCITY_FORWARDING_SECRET with a generated Velocity proxy forwarding secret.
# Replace REPLACE_ME_RCON_PASSWORD with a strong password for the Velocircon RCON
# server (used by the preStop transfer hook). It is referenced by the
# RCON_PASSWORD env var in mc-proxy-statefulset.yaml via secretKeyRef.
#
# Reseal after any change (accepts-transfers, new keys). Build the plain secret
# locally and seal it; never commit the plain values:
#
#   kubectl create secret generic velocity-config -n minecraft \
#     --from-file=velocity.toml=./velocity.toml \
#     --from-file=forwarding.secret=./forwarding.secret \
#     --from-file=server.toml=./server.toml \
#     --from-literal=rcon-password='REPLACE_ME_RCON_PASSWORD' \
#     --dry-run=client -o yaml | kubeseal -o yaml > apps/minecraft/velocity-secret.sealed.yaml
#
# (Split velocity.toml / forwarding.secret / server.toml out of this template
# file first; kubeseal consumes the plain files, not this template.)

apiVersion: v1
kind: Secret
metadata:
  name: velocity-config
  namespace: minecraft
type: Opaque
stringData:
  velocity.toml: |
    config-version = "2.8"
    bind = "0.0.0.0:25577"
    motd = "<gold>mc.dsns.dev\n<gray>SMP, Archive, and more"
    show-max-players = 500
    online-mode = true
    force-key-authentication = true
    prevent-client-proxy-connections = false
    player-info-forwarding-mode = "MODERN"
    forwarding-secret-file = "forwarding.secret"
    announce-forge = false
    kick-existing-players = false
    ping-passthrough = "DISABLED"
    enable-player-address-logging = true

    [servers]
    limbo = "limbo-service:25565"
    afk = "limbo-service:25565"
    lobby = "10.3.3.188:25565"
    try = ["lobby", "limbo"]

    [forced-hosts]

    [advanced]
    compression-threshold = 256
    compression-level = -1
    login-ratelimit = 3000
    connection-timeout = 5000
    read-timeout = 30000
    haproxy-protocol = false
    tcp-fast-open = false
    bungee-plugin-message-channel = true
    show-ping-requests = false
    failover-on-unexpected-server-disconnect = true
    announce-proxy-commands = true
    log-command-executions = false
    log-player-connections = true
    accepts-transfers = true

    [query]
    enabled = false
    port = 25577
    map = "Velocity"
    show-plugins = false

    [packet-limiter]
    interval = 7
    packets-per-second = -1
    bytes-per-second = -1
    decompressed-bytes-per-second = 5242880
  forwarding.secret: |
    REPLACE_ME_VELOCITY_FORWARDING_SECRET
  rcon-password: |
    REPLACE_ME_RCON_PASSWORD
  server.toml: |
    welcome_message = "Type /server [name] to move between servers!"
    action_bar = "Welcome to mc.dsns.dev!"

    default_game_mode = "survival"

    [forwarding]
    method = "MODERN"
    secret = "REPLACE_ME_VELOCITY_FORWARDING_SECRET"

    [tab_list]
    enabled = false
    player_listed = true

    [boss_bar]
    enabled = true
    color = "blue"
    division = 0
    health = 1.0
    title = "<blue><bold>Type /server [name] to move between servers!</bold></blue>"

    [title]
    enabled = false

    [world]
    spawn_position = [19.5, 16.0, 22.5]
    spawn_rotation = [-90.0, 0.0]
    dimension = "overworld"
    time = "day"

    [world.experimental]
    view_distance = 4
    schematic_file = "spawn.schem"
    lock_time = true