# Template only - DO NOT commit a real secret here.

# Command:
# kubeseal --format yaml --controller-name sealed-secrets-controller --controller-namespace kube-system < apps/minecraft/velocity-secret.plain.yaml > apps/minecraft/velocity-secret.sealed.yaml

# Replace REPLACE_ME_VELOCITY_FORWARDING_SECRET with a generated Velocity proxy forwarding secret.
# Replace REPLACE_ME_RCON_PASSWORD with a strong password for the Velocircon RCON
# server (used by the preStop transfer hook). It is referenced by the
# RCON_PASSWORD env var in mc-proxy-statefulset.yaml via secretKeyRef.
#
# velocity.toml / server.toml live in velocity-configmap.yaml (accepts-transfers
# is enabled there). Only secrets live here. Reseal after any change; build the
# plain secret locally and seal it, never commit the plain values:
#
#   kubectl create secret generic velocity-forwarding-secret -n minecraft \
#     --from-literal=forwarding.secret='REPLACE_ME_VELOCITY_FORWARDING_SECRET' \
#     --from-literal=rcon-password='REPLACE_ME_RCON_PASSWORD' \
#     --dry-run=client -o yaml | kubeseal -o yaml > apps/minecraft/velocity-secret.sealed.yaml

apiVersion: v1
kind: Secret
metadata:
  name: velocity-forwarding-secret
  namespace: minecraft
type: Opaque
stringData:
  forwarding.secret: |
    REPLACE_ME_VELOCITY_FORWARDING_SECRET
  rcon-password: |
    REPLACE_ME_RCON_PASSWORD
