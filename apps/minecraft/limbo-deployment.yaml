apiVersion: apps/v1
kind: Deployment
metadata:
  name: limbo
  namespace: minecraft
spec:
  replicas: 2
  selector:
    matchLabels:
      app: limbo
  template:
    metadata:
      labels:
        app: limbo
    spec:
      initContainers:
      - name: download-schematic
        image: alpine:latest
        command: ['sh', '-c', 'wget -O /data/spawn.schem https://github.com/LOOHP/Limbo/raw/refs/heads/master/spawn.schem']
        volumeMounts:
        - name: limbo-data
          mountPath: /data
      # Inject the forwarding secret into the plaintext server.toml template.
      # awk rewrites the whole placeholder line so the secret is never
      # interpreted (sed substitution would mangle secrets containing & or |).
      - name: render-server-config
        image: busybox:latest
        command: ['sh', '-c', 'SECRET=$(cat /forwarding-secret/forwarding.secret); awk -v secret="$SECRET" "{if (/__VELOCITY_FORWARDING_SECRET__/) print \"secret = \\\"\" secret \"\\\"\"; else print}" /config-template/server.toml > /rendered-config/server.toml']
        volumeMounts:
        - name: limbo-config
          mountPath: /rendered-config
        - name: velocity-config-template
          mountPath: /config-template
        - name: forwarding-secret
          mountPath: /forwarding-secret
      containers:
      - name: limbo
        image: ghcr.io/quozul/picolimbo:latest
        volumeMounts:
        - name: limbo-config
          mountPath: /usr/src/app/server.toml
          subPath: server.toml
        - name: limbo-data
          mountPath: /usr/src/app/spawn.schem
          subPath: spawn.schem
        stdin: true
        tty: true
      volumes:
      - name: limbo-config
        emptyDir: {}
      - name: velocity-config-template
        configMap:
          name: velocity-config
          items:
          - key: server.toml
            path: server.toml
      - name: forwarding-secret
        secret:
          secretName: velocity-forwarding-secret
          items:
          - key: forwarding.secret
            path: forwarding.secret
      - name: limbo-data
        emptyDir: {}
