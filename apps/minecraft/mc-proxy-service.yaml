apiVersion: v1
kind: Service
metadata:
  name: mc-proxy-service
  namespace: minecraft
spec:
  type: LoadBalancer
  loadBalancerIP: 10.3.3.11
  selector:
    app: mc-proxy
  ports:
  - name: minecraft
    port: 25565
    targetPort: 25577
  - name: voice-chat
    port: 25577
    protocol: UDP
    targetPort: 25577
