apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay for ephemeral per-PR / per-branch environments.
#
# Built on ../../base (shared workloads) plus a dummy staging Secret with
# the same name as prod, so Deployments mount it without changes:
#   - the prod Namespace object is excluded (staging namespaces are
#     per-PR/branch, supplied by the ArgoCD ApplicationSet
#     destination.namespace)
#   - the prod SealedSecret is excluded (SealedSecrets are strict-scoped to
#     their namespace and cannot decrypt elsewhere)
#
# Staging differences vs prod:
#   - LoadBalancer -> ClusterIP, loadBalancerIP (10.3.3.10) dropped, so
#     staging can never steal the prod virtual IP
#   - replicas scaled down to 1
#   - metadata.namespace stripped from every resource so ArgoCD deploys into
#     the ApplicationSet's dynamic destination namespace (+ CreateNamespace)
resources:
  - ../../base
  - staging-secret.yaml

commonAnnotations:
  homelab.dsns.dev/env: staging

replicas:
  - name: mc-proxy
    count: 1
  - name: limbo
    count: 1

patches:
  # Prod mc-proxy-service is a LoadBalancer pinned to 10.3.3.10.
  # Staging must be ClusterIP with no pinned IP.
  - target:
      kind: Service
      name: mc-proxy-service
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/loadBalancerIP
      - op: remove
        path: /metadata/namespace
  - target:
      kind: Service
      name: limbo-service
    patch: |-
      - op: remove
        path: /metadata/namespace
  - target:
      kind: Deployment
      name: mc-proxy
    patch: |-
      - op: remove
        path: /metadata/namespace
  - target:
      kind: Deployment
      name: limbo
    patch: |-
      - op: remove
        path: /metadata/namespace
