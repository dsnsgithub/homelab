apiVersion: v1
kind: Secret
metadata:
  # No namespace on purpose: the ArgoCD ApplicationSet's
  # destination.namespace supplies the per-PR/per-branch staging namespace.
  # Same object name as prod so Deployments mount it without changes.
  name: velocity-config
  annotations:
    homelab.dsns.dev/env: staging
type: Opaque
stringData:
  # Minimal STAGING config with dummy values — just enough for pods to start.
  # Shape mirrors apps/minecraft/velocity-secret.TEMPLATE.yaml.
  # SealedSecrets are strict-scoped (bound to name+namespace), so the prod
  # SealedSecret can NOT decrypt in a staging namespace. If a staging env
  # needs real credentials, re-seal them for that namespace, e.g.:
  #   kubeseal --format yaml --controller-name sealed-secrets-controller \
  #     --controller-namespace kube-system --scope namespace-wide \
  #     < velocity-secret.plain.yaml > staging-secret.sealed.yaml
  velocity.toml: |
    config-version = "2.8"
    bind = "0.0.0.0:25577"
    motd = "STAGING - mc.dsns.dev"
    show-max-players = 10
    online-mode = false
    force-key-authentication = false
    prevent-client-proxy-connections = false
    player-info-forwarding-mode = "MODERN"
    forwarding-secret-file = "forwarding.secret"
    announce-forge = false

    [servers]
    limbo = "limbo-service:25565"
    try = ["limbo"]
  forwarding.secret: |
    staging-dummy-forwarding-secret
  server.toml: |
    welcome_message = "STAGING environment"
    action_bar = "STAGING environment"

    default_game_mode = "survival"

    [forwarding]
    method = "MODERN"
    secret = "staging-dummy-forwarding-secret"

    [tab_list]
    enabled = false

    [boss_bar]
    enabled = false

    [title]
    enabled = false

    [world]
    spawn_position = [19.5, 16.0, 22.5]
    spawn_rotation = [-90.0, 0.0]
    dimension = "overworld"
    time = "day"

    [world.experimental]
    view_distance = 4
    schematic_file = "spawn.schem"
    lock_time = true
