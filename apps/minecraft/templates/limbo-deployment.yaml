apiVersion: apps/v1
kind: Deployment
metadata:
  name: limbo
  labels:
    {{- include "minecraft.labels" . | nindent 4 }}
    app: limbo
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: limbo
  template:
    metadata:
      labels:
        app: limbo
    spec:
      initContainers:
      - name: download-schematic
        image: {{ .Values.images.alpine }}
        command: ['sh', '-c', 'wget -O /data/spawn.schem {{ .Values.limbo.spawnSchematicURL }}']
        volumeMounts:
        - name: limbo-data
          mountPath: /data
      containers:
      - name: limbo
        image: {{ .Values.images.limbo }}
        env:
        - name: VELOCITY_FORWARDING_SECRET
          valueFrom:
            secretKeyRef:
              name: velocity-forwarding-secret
              key: forwarding.secret
        volumeMounts:
        - name: limbo-config
          mountPath: /usr/src/app/server.toml
          subPath: server.toml
        - name: limbo-data
          mountPath: /usr/src/app/spawn.schem
          subPath: spawn.schem
        stdin: true
        tty: true
      volumes:
      - name: limbo-config
        configMap:
          name: velocity-config
          items:
          - key: server.toml
            path: server.toml
      - name: limbo-data
        emptyDir: {}
