# Node IP selection (never claim the VIPs) and schedulable control planes:
# delete the default NoSchedule taint and the external-LB exclusion label
# (kube-vip must be able to bind VIPs on these nodes).
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 10.3.3.0/24
    - '!10.3.3.8/32'
    - '!10.3.3.9/32'
    - '!10.3.3.10/32'
    - '!10.3.3.11/32'
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
labels:
  node.kubernetes.io/exclude-from-external-load-balancers:
    $patch: delete
