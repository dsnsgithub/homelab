#   talosctl gen config homelab https://10.3.3.8:6443 --config-patch @talos/controlplane-patch.yaml
machine:
  network:
    interfaces:
      - deviceSelector:
          physical: true
        dhcp: true
        vip:
          ip: 10.3.3.8
cluster:
  etcd:
    # Keep initial-advertise-peer-urls / advertise-client-urls off the VIPs.
    # listenSubnets defaults to advertisedSubnets.
    advertisedSubnets:
      - 10.3.3.0/24
      - '!10.3.3.8/32'
      - '!10.3.3.9/32'
      - '!10.3.3.10/32'
---
apiVersion: v1alpha1
kind: KubeNodeConfig
# Pin kubelet --node-ip to the real DHCP address. Without this the VIP
# (.8) or a kube-vip LB IP (.9/.10) that happens to be on the interface
# can be picked as INTERNAL-IP in `kubectl get nodes -o wide`.
# (v1.14: nodeIP lives on KubeNodeConfig; machine.kubelet.nodeIP is deprecated.)
nodeIP:
  validSubnets:
    - 10.3.3.0/24
    - '!10.3.3.8/32'
    - '!10.3.3.9/32'
    - '!10.3.3.10/32'
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
labels:
  node.kubernetes.io/exclude-from-external-load-balancers:
    $patch: delete
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.size >= 20u * GB
  wipe: false
