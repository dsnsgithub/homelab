# Talos control-plane VIP - replaces kube-vip cp_enable=true from k3s.
# This file is versioned here to avoid drift. Pass it to talosctl:
#   talosctl gen config homelab https://10.3.3.8:6443 --config-patch @talos/controlplane-patch.yaml
# Uses deviceSelector (not interface: eth0) to mimic kube-vip autodetect:
# all nodes have different NIC names, so we select the single physical NIC.
# If a node has multiple physical NICs, see talos/node-overrides/README.md.
machine:
  network:
    interfaces:
      - deviceSelector:
          physical: true
        dhcp: true
        vip:
          ip: 10.3.3.8
