# Install disk selection for (re)provisioning. Talos >= 1.14 requires the
# UnattendedInstallConfig document; .machine.install is deprecated and the
# two are mutually exclusive (a node rejects a config containing both).
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.size >= 20u * GB
  wipe: false
