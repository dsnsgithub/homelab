# Talos GitOps inventory — source of truth for the self-hosted apply workflow.
#
# Fill in the DHCP-reserved (or static) LAN IP for each node. Hostname must
# match talos/nodes/<patch> (HostnameConfig). The workflow in
# .github/workflows/talos-gitops.yaml loops this list IN ORDER, one node at
# a time, so etcd never loses quorum.
#
# To add a node: add talos/nodes/cp-0N.yaml + append here. To remove: reset
# the node first (see docs/operations.md), then delete its entry.
clusterName: homelab
endpoint: https://10.3.3.8:6443
talosVersion: v1.14.0 # workflow pins talosctl to this; keep in sync with docs/bootstrap.md
nodes:
  - name: talos-m2
    ip: 10.3.3.21 # TODO: replace with the real DHCP-reserved IP of cp-01
    patch: nodes/cp-01.yaml
  - name: talos-m4
    ip: 10.3.3.22 # TODO: replace with the real DHCP-reserved IP of cp-02
    patch: nodes/cp-02.yaml
  - name: talos-raider
    ip: 10.3.3.23 # TODO: replace with the real DHCP-reserved IP of cp-03
    patch: nodes/cp-03.yaml
