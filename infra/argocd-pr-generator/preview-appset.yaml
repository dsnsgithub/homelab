apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: preview-deploy
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - pullRequest:
              github:
                owner: dsnsgithub
                repo: homelab
                tokenRef:
                  secretName: github-pr-generator-token
                  key: token
                labels:
                  - preview
              requeueAfterSeconds: 120
          - git:
              repoURL: https://github.com/dsnsgithub/homelab.git
              revision: "{{.head_sha}}"
              directories:
                - path: apps/*
                - path: apps/web-proxy
                  exclude: true
  template:
    metadata:
      name: "{{.path.basename}}-pr-{{.number}}"
      annotations:
        notifications.argoproj.io/subscribe.on-preview-synced.github-api: ""
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/dsnsgithub/homelab.git
        targetRevision: "{{.head_sha}}"
        path: "{{.path.path}}"
        kustomize:
          namespace: "{{.path.basename}}-pr-{{.number}}"
          patches:
            # Previews must not fight prod for 10.3.3.11 (kube-vip ARPs the
            # same VIP from both Services). Give mc-proxy a per-PR IP in the
            # reserved 10.3.3.30-39 range. Target by name so ClusterIP
            # Services (v2ray, limbo) without loadBalancerIP still sync.
            - target:
                kind: Service
                name: mc-proxy-service
              patch: |-
                - op: replace
                  path: /spec/loadBalancerIP
                  value: "10.3.3.{{ add 30 (mod (atoi (printf \"%v\" .number)) 10) }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}-pr-{{.number}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true