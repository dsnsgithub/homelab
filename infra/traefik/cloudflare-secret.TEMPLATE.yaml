# Template only - DO NOT commit a real token here.
# Traefik is ArgoCD-managed in namespace `traefik`, so the token must be
# sealed for that namespace (a kube-system sealed secret will NOT decrypt
# there - sealed secrets are namespace-locked).
#
# 1. Create the Cloudflare API token at
#    https://dash.cloudflare.com/profile/api-tokens
#    ("Edit zone DNS": Zone DNS:Edit + Zone Read on dsns.dev, mseung.dev, seung.dev)
# 2. kubectl -n traefik create secret generic traefik-cloudflare \
#      --from-literal=CF_DNS_API_TOKEN='<YOUR_TOKEN>' \
#      --dry-run=client -o yaml > infra/traefik/cloudflare-secret.plain.yaml
#    (named *.plain.yaml so .gitignore skips it)
# 3. kubeseal --format yaml \
#      --controller-name sealed-secrets-controller --controller-namespace kube-system \
#      < infra/traefik/cloudflare-secret.plain.yaml \
#      > infra/traefik/cloudflare-secret.sealed.yaml
#    rm infra/traefik/cloudflare-secret.plain.yaml  # never commit the plain file
# 4. Uncomment cloudflare-secret.sealed.yaml in kustomization.yaml, commit, push.
apiVersion: v1
kind: Secret
metadata:
  name: traefik-cloudflare
  namespace: traefik
type: Opaque
stringData:
  CF_DNS_API_TOKEN: "REPLACE_ME_WITH_CLOUDFLARE_DNS_EDIT_TOKEN"
