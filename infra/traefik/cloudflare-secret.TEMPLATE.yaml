# Template only - DO NOT commit a real token here.
# 1. Create the Cloudflare API token at:
#    https://dash.cloudflare.com/profile/api-tokens
#    Template: "Edit zone DNS" -> Zone: DNS:Edit + Zone: Read
#    Zone Resources: Include all 3 zones (dsns.dev, mseung.dev, seung.dev)
#    (or All zones if you prefer).
# 2. Create the plain Secret locally (named *.plain.yaml so .gitignore skips it):
#    kubectl -n kube-system create secret generic traefik-cloudflare \
#      --from-literal=CF_DNS_API_TOKEN='<YOUR_TOKEN>' \
#      --dry-run=client -o yaml > infra/traefik/cloudflare-secret.plain.yaml
# 3. Seal it with kubeseal (must match YOUR cluster's sealed-secrets key):
#    kubeseal --format yaml \
#      --controller-name sealed-secrets --controller-namespace kube-system \
#      < infra/traefik/cloudflare-secret.plain.yaml \
#      > infra/traefik/cloudflare-secret.sealed.yaml
#    rm infra/traefik/cloudflare-secret.plain.yaml  # never commit the plain file
# 4. Add cloudflare-secret.sealed.yaml to infra/traefik/kustomization.yaml
#    resources, commit, and let ArgoCD sync (or kubectl apply).
# 5. Traefik must be able to read this Secret: it lives in kube-system
#    because k3s runs Traefik there.
apiVersion: v1
kind: Secret
metadata:
  name: traefik-cloudflare
  namespace: kube-system
type: Opaque
stringData:
  CF_DNS_API_TOKEN: "REPLACE_ME_WITH_CLOUDFLARE_DNS_EDIT_TOKEN"
