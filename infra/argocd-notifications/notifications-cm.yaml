apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # Reuses your GitHub PAT (same value you put in github-pr-generator-token,
  # but with `repo` scope so it can post PR comments). Resolved from the
  # `github-token` key in the `argocd-notifications-secret` Secret.
  service.webhook.github-api: |
    url: https://api.github.com
    headers:
      - name: Authorization
        value: Bearer $github-token
      - name: Content-Type
        value: application/json

  # Posts/updates one comment per preview Application. The IP math must stay
  # in sync with the loadBalancerIP patch in preview-appset.yaml
  # (10.3.3.30 + PR number mod 10).
  template.preview-comment: |
    webhook:
      github-api:
        method: POST
        path: /repos/dsnsgithub/homelab/issues/{{regexReplaceAll ".*-pr-(\\d+)" .app.metadata.name "$1"}}/comments
        body: |
          {
            "body": "Preview ready: `{{.app.metadata.name}}` @ `{{.app.status.operationState.syncResult.revision}}`\n\n{{ $pr := regexReplaceAll \".*-pr-(\\d+)\" .app.metadata.name \"$1\" }}{{ $last := add 30 (mod (atoi $pr) 10) }}- Minecraft Java: `10.3.3.{{$last}}:25565` / voice `10.3.3.{{$last}}:25577/UDP`\n- Prod stays `10.3.3.11` — do not point players at the preview IP.\n- Argo CD: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}"
          }

  trigger.on-preview-synced: |
    - when: app.status.operationState.phase in ['Succeeded']
      oncePer: app.status.operationState.syncResult.revision
      send: [preview-comment]
