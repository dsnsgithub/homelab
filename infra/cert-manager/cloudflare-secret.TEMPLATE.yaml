# Create a Cloudflare API token with Zone DNS:Edit + Zone Read on dsns.dev, mseung.dev, seung.dev.
# kubeseal --format yaml --controller-name sealed-secrets-controller --controller-namespace kube-system < infra/cert-manager/cloudflare-secret.plain.yaml > /tmp/cloudflare-sealed.yaml
# then copy spec.encryptedData["api-token"] into infra/cert-manager/templates/sealedsecret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "REPLACE_ME_WITH_CLOUDFLARE_DNS_EDIT_TOKEN"
