# Template only - DO NOT commit a real token here.
# cert-manager's ClusterIssuer solver secret MUST live in the cert-manager
# namespace (namespace-locked like all sealed secrets - the old traefik /
# kube-system sealed secrets cannot be reused, seal again).
#
# 1. Create the Cloudflare API token at
#    https://dash.cloudflare.com/profile/api-tokens
#    ("Edit zone DNS": Zone DNS:Edit + Zone Read on dsns.dev, mseung.dev, seung.dev)
# 2. kubectl -n cert-manager create secret generic cloudflare-api-token \
#      --from-literal=api-token='<YOUR_TOKEN>' \
#      --dry-run=client -o yaml > infra/cert-manager/cloudflare-secret.plain.yaml
#    (named *.plain.yaml so .gitignore skips it)
# 3. kubeseal --format yaml \
#      --controller-name sealed-secrets-controller --controller-namespace kube-system \
#      < infra/cert-manager/cloudflare-secret.plain.yaml \
#      > infra/cert-manager/cloudflare-secret.sealed.yaml
#    rm infra/cert-manager/cloudflare-secret.plain.yaml  # never commit the plain file
# 4. Uncomment cloudflare-secret.sealed.yaml in kustomization.yaml, commit, push.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "REPLACE_ME_WITH_CLOUDFLARE_DNS_EDIT_TOKEN"
