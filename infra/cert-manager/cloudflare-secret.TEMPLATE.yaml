# 1. Create a Cloudflare API token with Zone DNS:Edit + Zone Read on dsns.dev, mseung.dev, seung.dev.
# 2. cp infra/cert-manager/cloudflare-secret.TEMPLATE.yaml infra/cert-manager/cloudflare-secret.plain.yaml and put the token in stringData.
# 3. kubeseal --format yaml --controller-name sealed-secrets-controller --controller-namespace kube-system < infra/cert-manager/cloudflare-secret.plain.yaml > infra/cert-manager/cloudflare-secret.sealed.yaml
# 4. rm infra/cert-manager/cloudflare-secret.plain.yaml
# 5. Uncomment cloudflare-secret.sealed.yaml in kustomization.yaml, commit, push.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "REPLACE_ME_WITH_CLOUDFLARE_DNS_EDIT_TOKEN"
