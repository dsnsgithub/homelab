image:
  repository: ghcr.io/kube-vip/kube-vip
  tag: v1.0.4
  pullPolicy: Always

env:
  vip_arp: "true"
  vip_interface: ""
  cp_enable: "false"
  svc_enable: "true"
  svc_election: "true"
  vip_ddns: "false"
  vip_leaderelection: "true"
  vip_leaseduration: "5"
  vip_renewdeadline: "3"
  vip_retryperiod: "1"

securityContext:
  capabilities:
    add:
      - NET_ADMIN
      - NET_RAW
      - SYS_TIME
    drop: []

updateStrategy: {}

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists

tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists