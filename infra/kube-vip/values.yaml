image:
  repository: ghcr.io/kube-vip/kube-vip
  tag: v1.0.4
  pullPolicy: Always

settings:
  vipArp: "true"
  vipInterface: ""
  controlPlaneEnable: "false"
  servicesEnable: "true"
  servicesElection: "true"
  vipDdns: "false"
  vipLeaderElection: "true"
  vipLeaseDuration: "5"
  vipRenewDeadline: "3"
  vipRetryPeriod: "1"

serviceAccount:
  name: kube-vip
