apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip-ds
  labels:
    {{- include "kube-vip.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip-ds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip-ds
        app.kubernetes.io/version: {{ .Values.image.tag }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      containers:
      - args:
        - manager
        env:
        - name: vip_arp
          value: {{ .Values.settings.vipArp | quote }}
        - name: vip_interface
          value: {{ .Values.settings.vipInterface | quote }}
        - name: cp_enable
          value: {{ .Values.settings.controlPlaneEnable | quote }}
        - name: svc_enable
          value: {{ .Values.settings.servicesEnable | quote }}
        - name: svc_election
          value: {{ .Values.settings.servicesElection | quote }}
        - name: vip_ddns
          value: {{ .Values.settings.vipDdns | quote }}
        - name: vip_leaderelection
          value: {{ .Values.settings.vipLeaderElection | quote }}
        - name: vip_leaseduration
          value: {{ .Values.settings.vipLeaseDuration | quote }}
        - name: vip_renewdeadline
          value: {{ .Values.settings.vipRenewDeadline | quote }}
        - name: vip_retryperiod
          value: {{ .Values.settings.vipRetryPeriod | quote }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: kube-vip
        resources: {}
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            - SYS_TIME
      hostNetwork: true
      serviceAccountName: {{ .Values.serviceAccount.name }}
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
  updateStrategy: {}
