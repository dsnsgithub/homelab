apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: piraeus-datastore
  namespace: argocd
  annotations:
    # Cluster, storage pool, and StorageClass after the operator (-2) but
    # before workloads such as t3-code (0) that claim volumes from them.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/dsnsgithub/homelab.git
    targetRevision: main
    path: infra/piraeus-datastore
  destination:
    server: https://kubernetes.default.svc
    namespace: piraeus-datastore
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
