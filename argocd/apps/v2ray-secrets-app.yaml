apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: v2ray-secrets
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-running.github: dsnsgithub/homelab
    notifications.argoproj.io/subscribe.on-sync-succeeded.github: dsnsgithub/homelab
    notifications.argoproj.io/subscribe.on-sync-failed.github: dsnsgithub/homelab
spec:
  project: default
  source:
    repoURL: https://github.com/dsnsgithub/homelab.git
    targetRevision: main
    path: charts/v2ray-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: v2ray-vpn
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # The notifications controller records what it sent in
  # `notified.notifications.argoproj.io/*` annotations on the Application
  # object. Ignore those or the root app would see phantom drift and flap
  # between OutOfSync and Synced on every notification.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jqPathExpressions:
        - '.metadata.annotations | with_entries(select(.key | startswith("notified.notifications.argoproj.io")))'
