name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      talos:
        description: Apply Talos machine configs even if talos/ didn't change
        type: boolean
        default: false

permissions:
  contents: read

env:
  ARGOCD_SERVER: 10.3.3.9
  ARGOCD_OPTS: --insecure --grpc-web
  REPO_URL: https://github.com/dsnsgithub/homelab.git

jobs:
  talos:
    name: talos
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: talos aqua:postfinance/topf
      - name: Validate machine configs
        run: |
          cp -r talos "$RUNNER_TEMP/talos"
          talosctl gen secrets --force -o "$RUNNER_TEMP/talos/secrets.yaml"
          topf --topfconfig "$RUNNER_TEMP/talos/topf.yaml" render -o "$RUNNER_TEMP/out"
          for config in "$RUNNER_TEMP"/out/*.yaml; do
            talosctl validate --mode metal --strict -c "$config"
          done

  diff:
    name: diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Reject fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Fork PRs can't be diffed against the cluster. Push the branch to this repository instead."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: argocd
      - name: Connect to home LAN
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: .github/scripts/vpn-up.sh
      - name: Diff production apps at this commit
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          comment="$RUNNER_TEMP/comment.md"
          changed=0 failed=0
          for app in $(argocd app list -p default -o name); do
            spec=$(argocd app get "$app" -o json)
            pos=$(jq -r --arg repo "$REPO_URL" '(.spec.sources // []) | to_entries[] | select(.value.repoURL == $repo) | .key + 1' <<<"$spec" | head -1)
            if [ -n "$pos" ]; then
              args=(--revisions "$HEAD_SHA" --source-positions "$pos")
            elif [ "$(jq -r '.spec.source.repoURL' <<<"$spec")" = "$REPO_URL" ]; then
              args=(--revision "$HEAD_SHA")
            else
              continue
            fi
            rc=0
            argocd app diff "$app" "${args[@]}" --server-side-diff >"$RUNNER_TEMP/out" 2>"$RUNNER_TEMP/err" || rc=$?
            case $rc in
              0) continue ;;
              1) changed=$((changed + 1)); body="$RUNNER_TEMP/out"; summary="${app#*/} changes" ;;
              *) failed=$((failed + 1)); body="$RUNNER_TEMP/err"; summary="${app#*/} failed"
                 echo "::error::${app#*/}: $(tail -1 "$RUNNER_TEMP/err")" ;;
            esac
            fence="\`\`\`"
            printf '<details><summary>%s</summary>\n\n%sdiff\n%s\n%s\n</details>\n\n' \
              "$summary" "$fence" "$(head -c 20000 "$body")" "$fence" >>"$RUNNER_TEMP/details.md"
          done
          {
            echo "<!-- argocd-diff -->"
            echo "### Production diff at \`${HEAD_SHA:0:7}\`"
            echo
            if [ $((changed + failed)) -eq 0 ]; then
              echo "No changes to production apps."
            else
              echo "$changed app(s) change, $failed app(s) fail to render or validate."
              echo
              cat "$RUNNER_TEMP/details.md"
            fi
          } >"$comment"
          cat "$comment" >>"$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q '.[] | select(.body | startswith("<!-- argocd-diff -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$comment" >/dev/null
          else
            gh pr comment "$PR" --body-file "$comment"
          fi
          [ "$failed" -eq 0 ]

  preview:
    name: preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether this PR needs previews
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'preview') }}
        run: |
          charts=$(for f in charts/*/values-preview.yaml; do basename "$(dirname "$f")"; done)
          changed=$(git diff --name-only "$BASE_SHA" HEAD | awk -F/ '$1 == "charts" {print $2}' | sort -u | grep -Fx -f <(echo "$charts") || true)
          echo "apps=$(for c in $charts; do printf '%s-pr-%s ' "$c" "$PR"; done)" >>"$GITHUB_OUTPUT"
          if [ -n "$changed" ] || [ "$LABELED" = true ]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            echo "No previewable charts changed." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Label PR for the preview ApplicationSet
        if: steps.scope.outputs.enabled == 'true'
        run: |
          gh label create preview --color 0E8A16 --description "Deploy a preview of this PR" --force
          gh pr edit "$PR" --add-label preview
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        if: steps.scope.outputs.enabled == 'true'
        with:
          install_args: argocd
      - name: Connect to home LAN
        if: steps.scope.outputs.enabled == 'true'
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: .github/scripts/vpn-up.sh
      - name: Wait for previews
        id: wait
        if: steps.scope.outputs.enabled == 'true'
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          APPS: ${{ steps.scope.outputs.apps }}
        run: |
          deadline=$((SECONDS + 300))
          for app in $APPS; do
            until [ "$(argocd app get "$app" -o json 2>/dev/null | jq -r '.spec.source.targetRevision')" = "$HEAD_SHA" ]; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::The ApplicationSet didn't create $app at ${HEAD_SHA:0:7}."
                exit 1
              fi
              sleep 5
            done
          done
          # shellcheck disable=SC2086
          if ! argocd app wait $APPS --sync --health --operation --timeout 600; then
            for app in $APPS; do argocd app get "$app"; done
            exit 1
          fi
      - name: Comment preview status on PR
        if: always() && steps.scope.outputs.enabled == 'true'
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          APPS: ${{ steps.scope.outputs.apps }}
          OUTCOME: ${{ steps.wait.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          comment="$RUNNER_TEMP/comment.md"
          {
            echo "<!-- preview-status -->"
            if [ "$OUTCOME" = success ]; then
              echo "### Preview is healthy at \`${HEAD_SHA:0:7}\`"
            else
              echo "### Preview failed at \`${HEAD_SHA:0:7}\` ([logs]($RUN_URL))"
            fi
            echo
            echo "| App | Sync | Health |"
            echo "|---|---|---|"
            for app in $APPS; do
              argocd app get "$app" -o json 2>/dev/null \
                | jq -r '"| \(.metadata.name) | \(.status.sync.status) | \(.status.health.status) |"' \
                || echo "| $app | Missing | - |"
            done
          } >"$comment"
          cat "$comment" >>"$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q '.[] | select(.body | startswith("<!-- preview-status -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$comment" >/dev/null
          else
            gh pr comment "$PR" --body-file "$comment"
          fi

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Find what changed
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          FORCE_TALOS: ${{ inputs.talos }}
        run: |
          talos=${FORCE_TALOS:-false}
          if [ "$talos" != true ] && git cat-file -e "${BEFORE:-0000}^{commit}" 2>/dev/null \
            && git diff --name-only "$BEFORE" HEAD | grep -q '^talos/'; then
            talos=true
          fi
          echo "talos=$talos" >>"$GITHUB_OUTPUT"
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: argocd talos sops aqua:postfinance/topf
      - name: Connect to home LAN
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: .github/scripts/vpn-up.sh
      - name: Apply Talos machine configs
        if: steps.changes.outputs.talos == 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: topf --topfconfig talos/topf.yaml apply --confirm=false --colored never
      - name: Wait for Argo CD
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          argocd app get root --refresh >/dev/null
          argocd app wait root --sync --health --operation --timeout 300
          apps=$(argocd app list -p default -o name)
          for app in $apps; do argocd app get "$app" --refresh >/dev/null & done
          wait
          rc=0
          # shellcheck disable=SC2086
          argocd app wait $apps --sync --health --operation --timeout 900 || rc=$?
          { echo '```'; argocd app list -p default; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            for app in $apps; do argocd app get "$app"; done
          fi
          exit "$rc"
