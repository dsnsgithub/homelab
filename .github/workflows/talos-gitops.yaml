name: talos-gitops

on:
  push:
    branches: [main]
    paths:
      - "talos/**"
      - ".sops.yaml"
      - ".github/workflows/talos-gitops.yaml"
  pull_request:
    paths:
      - "talos/**"
      - ".sops.yaml"
      - ".github/workflows/talos-gitops.yaml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply to nodes after render (self-hosted runner only)"
        required: false
        default: "false"

concurrency:
  group: talos-gitops
  cancel-in-progress: false

env:
  TOPF_VERSION: v0.6.0
  SOPS_VERSION: v3.13.3
  TALOS_VERSION: v1.14.0
  KUBECTL_VERSION: v1.37.0

jobs:
  plan:
    name: render + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install topf + sops + talosctl
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch $ARCH" >&2; exit 1 ;;
          esac
          curl -sSL -o /tmp/topf.tar.gz "https://github.com/postfinance/topf/releases/download/${TOPF_VERSION}/topf_linux_${ARCH}.tar.gz"
          tar xzf /tmp/topf.tar.gz -C /tmp
          sudo mv /tmp/topf /usr/local/bin/topf
          topf --version
          curl -sSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.${ARCH}"
          chmod +x /tmp/sops
          sudo mv /tmp/sops /usr/local/bin/sops
          sops --version
          curl -sSL -o /tmp/talosctl "https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}/talosctl-linux-${ARCH}"
          chmod +x /tmp/talosctl
          sudo mv /tmp/talosctl /usr/local/bin/talosctl
          talosctl version --client

      - name: Structural check (always runs)
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import glob, yaml
          inv = yaml.safe_load(open('talos/topf.yaml'))
          assert inv['clusterName'] == 'homelab', inv.get('clusterName')
          assert inv['clusterEndpoint'] == 'https://10.3.3.8:6443'
          assert len(inv.get('nodes', [])) >= 3, 'need at least 3 nodes for etcd quorum'
          for n in inv['nodes']:
              assert n.get('host') and n.get('ip') and n.get('role'), f"incomplete node: {n}"
              print(f"ok: {n['host']} {n['ip']} {n['role']}")
          patches = sorted(glob.glob('talos/all/*') + glob.glob('talos/control-plane/*') +
                           glob.glob('talos/worker/*') + glob.glob('talos/node/*/*'))
          assert patches, 'no patches found under talos/'
          for p in patches:
              if p.endswith('.tpl'):
                  print(f"ok (template, rendered at plan time): {p}")
                  continue
              docs = [d for d in yaml.safe_load_all(open(p)) if d]
              assert docs, f"empty patch: {p}"
              print(f"ok ({len(docs)} docs): {p}")
          print('structural check passed')
          EOF

      - name: Render machine configs
        if: secrets.SOPS_AGE_KEY != ''
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          if [ ! -f talos/secrets.yaml ]; then
            echo "talos/secrets.yaml not committed yet (one-time setup pending); skipping render."
            exit 0
          fi
          rm -rf /tmp/rendered
          topf --topfconfig talos/topf.yaml render -o /tmp/rendered
          ls -la /tmp/rendered

      - name: Validate rendered configs
        if: secrets.SOPS_AGE_KEY != ''
        run: |
          set -euo pipefail
          if [ ! -d /tmp/rendered ]; then
            echo "nothing rendered; skipping validation."
            exit 0
          fi
          for f in /tmp/rendered/*.yaml; do
            talosctl validate --config "$f" --mode metal
          done
          python3 - <<'EOF'
          import glob, yaml
          inv = yaml.safe_load(open('talos/topf.yaml'))
          assert inv['clusterName'] == 'homelab'
          assert inv['clusterEndpoint'] == 'https://10.3.3.8:6443'
          assert len(inv['nodes']) >= 3, 'need at least 3 nodes for etcd quorum'
          for n in inv['nodes']:
              docs = list(yaml.safe_load_all(open(f"/tmp/rendered/{n['host']}.yaml")))
              kinds = {d.get('kind') for d in docs if isinstance(d, dict)}
              assert 'KubeNodeConfig' in kinds, f"{n['host']}: KubeNodeConfig missing"
              assert 'UnattendedInstallConfig' in kinds, f"{n['host']}: UnattendedInstallConfig missing"
              hostnames = [d.get('hostname') for d in docs if isinstance(d, dict) and d.get('kind') == 'HostnameConfig']
              assert hostnames == [n['host']], f"{n['host']}: hostname mismatch {hostnames}"
              print(f"ok: {n['host']} ({n['ip']}) kinds={sorted(kinds)}")
          print('render check passed')
          EOF

      - name: Inventory-only notice (no age key on PR)
        if: secrets.SOPS_AGE_KEY == ''
        run: echo "SOPS_AGE_KEY not set; skipped render. Set the secret to get full plan output."

  apply:
    name: apply node-by-node (self-hosted)
    needs: plan
    if: >
      needs.plan.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.apply == 'true'))
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install topf + sops + talosctl + kubectl
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch $ARCH" >&2; exit 1 ;;
          esac
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          BIN_DIR=/usr/local/bin
          command -v sudo >/dev/null || BIN_DIR="$HOME/.local/bin"
          mkdir -p "$BIN_DIR"
          export PATH="$BIN_DIR:$PATH"
          if ! command -v topf >/dev/null; then
            curl -sSL -o /tmp/topf.tar.gz "https://github.com/postfinance/topf/releases/download/${TOPF_VERSION}/topf_${OS}_${ARCH}.tar.gz"
            tar xzf /tmp/topf.tar.gz -C /tmp
            mv /tmp/topf "$BIN_DIR/topf"
          fi
          topf --version
          if ! command -v sops >/dev/null; then
            curl -sSL -o "$BIN_DIR/sops" "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.${OS}.${ARCH}"
            chmod +x "$BIN_DIR/sops"
          fi
          sops --version
          if ! command -v talosctl >/dev/null; then
            curl -sSL -o "$BIN_DIR/talosctl" "https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}/talosctl-${OS}-${ARCH}"
            chmod +x "$BIN_DIR/talosctl"
          fi
          talosctl version --client
          if ! command -v kubectl >/dev/null; then
            curl -sSL -o "$BIN_DIR/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/${OS}/${ARCH}/kubectl"
            chmod +x "$BIN_DIR/kubectl"
          fi
          kubectl version --client

      - name: Restore cluster credentials
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${SOPS_AGE_KEY:?set SOPS_AGE_KEY}" || exit 1
          export SOPS_AGE_KEY TALOSCONFIG=~/.talos/config
          mkdir -p ~/.talos ~/.kube
          topf --topfconfig talos/topf.yaml talosconfig --confirm=false > ~/.talos/config
          chmod 600 ~/.talos/config
          if [ -n "${KUBECONFIG_B64:-}" ]; then
            echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
            chmod 600 ~/.kube/config
          else
            topf --topfconfig talos/topf.yaml kubeconfig --confirm=false > ~/.kube/config
            chmod 600 ~/.kube/config
          fi
          kubectl get nodes -o wide

      - name: Show cluster diff (dry-run)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          export SOPS_AGE_KEY
          set +e
          topf --topfconfig talos/topf.yaml apply --dry-run --confirm=false
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "no changes detected"
          elif [ "$code" -eq 2 ]; then
            echo "changes detected, proceeding to rolling apply"
          else
            echo "dry-run failed with code $code" >&2
            exit 1
          fi

      - name: Apply one node at a time
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          DRAIN_BEFORE_APPLY: "true"
        run: |
          set -euo pipefail
          export SOPS_AGE_KEY TALOSCONFIG=~/.talos/config
          HOSTS=$(python3 -c "import yaml; print(' '.join(n['host'] for n in yaml.safe_load(open('talos/topf.yaml'))['nodes']))")
          ALL_IPS=$(python3 -c "import yaml; print(','.join(n['ip'] for n in yaml.safe_load(open('talos/topf.yaml'))['nodes']))")
          echo "etcd set: $ALL_IPS"
          talosctl etcd status -n "$ALL_IPS"
          for HOST in $HOSTS; do
            echo "===== $HOST ====="
            if [ "${DRAIN_BEFORE_APPLY}" = "true" ]; then
              kubectl cordon "$HOST"
              kubectl drain "$HOST" --ignore-daemonsets --delete-emptydir-data --timeout=120s
            fi
            topf --topfconfig talos/topf.yaml apply --nodes-filter "^${HOST}$" --confirm=false
            kubectl wait --for=condition=Ready "node/$HOST" --timeout=10m
            kubectl uncordon "$HOST" || true
            talosctl etcd status -n "$ALL_IPS"
            kubectl get nodes -o wide
            echo "----- $HOST done, quorum healthy -----"
          done
