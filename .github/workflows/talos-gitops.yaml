# Talos GitOps: render on every PR/push touching talos/, auto-apply on main.
#
# Architecture: Talos machine config lives outside the Kubernetes API
# (Talos API :50000), so Argo CD cannot apply it. Instead a LAN-reachable
# self-hosted runner applies it with talosctl, one node at a time.
#
# Required GitHub Actions secrets (Settings > Secrets and variables > Actions):
#   TALOS_SECRETS_YAML_B64  base64 -w0 _talos/secrets.yaml   (cluster PKI, irreplaceable)
#   TALOSCONFIG_B64         base64 -w0 _talos/talosconfig    (admin access)
#   KUBECONFIG_B64          base64 -w0 ~/.kube/config        (optional; else fetched via talosctl)
#
# Node list (name/IP/patch) is the source of truth in talos/nodes.yaml.
name: talos-gitops

on:
  push:
    branches: [main]
    paths:
      - "talos/**"
      - ".github/workflows/talos-gitops.yaml"
  pull_request:
    paths:
      - "talos/**"
      - ".github/workflows/talos-gitops.yaml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply to nodes after render (self-hosted runner only)"
        required: false
        default: "false"

concurrency:
  group: talos-gitops
  cancel-in-progress: false

env:
  TALOS_VERSION: v1.14.0
  KUBECTL_VERSION: v1.37.0

jobs:
  plan:
    name: render + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install talosctl
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch $ARCH" >&2; exit 1 ;;
          esac
          curl -sSL -o talosctl "https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}/talosctl-linux-${ARCH}"
          chmod +x talosctl
          sudo mv talosctl /usr/local/bin/talosctl
          talosctl version --client

      - name: Validate inventory vs patch files
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import sys, yaml
          inv = yaml.safe_load(open('talos/nodes.yaml'))
          assert inv.get('clusterName') == 'homelab', 'clusterName must be homelab'
          assert inv.get('endpoint') == 'https://10.3.3.8:6443', 'endpoint must be https://10.3.3.8:6443'
          nodes = inv.get('nodes', [])
          assert len(nodes) >= 3, 'need at least 3 nodes for etcd quorum'
          seen = set()
          for n in nodes:
              for k in ('name', 'ip', 'patch'):
                  assert n.get(k), f"node entry missing {k}: {n}"
              assert (n['name'], n['ip']) not in seen, f"duplicate node {n}"
              seen.add((n['name'], n['ip']))
              p = yaml.safe_load(open(f"talos/{n['patch']}"))
              assert p.get('hostname') == n['name'], (
                  f"{n['patch']} hostname {p.get('hostname')!r} != inventory name {n['name']!r}")
              print(f"ok: {n['name']} {n['ip']} {n['patch']}")
          print(f"inventory valid: {len(nodes)} nodes")
          EOF

      - name: Render machine configs
        if: secrets.TALOS_SECRETS_YAML_B64 != ''
        env:
          TALOS_SECRETS_YAML_B64: ${{ secrets.TALOS_SECRETS_YAML_B64 }}
        run: |
          set -euo pipefail
          mkdir -p _talos
          echo "$TALOS_SECRETS_YAML_B64" | base64 -d > _talos/secrets.yaml
          chmod 600 _talos/secrets.yaml
          INV_ENDPOINT=$(python3 -c "import yaml; print(yaml.safe_load(open('talos/nodes.yaml'))['endpoint'])")
          talosctl gen config homelab "$INV_ENDPOINT" \
            --with-secrets _talos/secrets.yaml \
            --config-patch-control-plane @talos/controlplane-patch.yaml \
            --output-dir _talos --force
          talosctl validate --config _talos/controlplane.yaml --mode metal || \
            talosctl validate --config _talos/controlplane.yaml
          echo "rendered $(wc -l < _talos/controlplane.yaml) lines"

      - name: Per-node patched render check
        if: secrets.TALOS_SECRETS_YAML_B64 != ''
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import subprocess, yaml
          inv = yaml.safe_load(open('talos/nodes.yaml'))
          for n in inv['nodes']:
              out = f"_talos/rendered-{n['name']}.yaml"
              subprocess.run(['talosctl', 'machineconfig', 'patch',
                              '_talos/controlplane.yaml',
                              '-p', f"@{n['patch'] if n['patch'].startswith('/') else 'talos/' + n['patch']}",
                              '-o', out], check=True)
              print(f"rendered {out}")
          EOF

      - name: Inventory-only notice (no secrets on PR)
        if: secrets.TALOS_SECRETS_YAML_B64 == ''
        run: echo "TALOS_SECRETS_YAML_B64 not set; skipped render. Inventory check above is the plan."

  apply:
    name: apply node-by-node (self-hosted)
    needs: plan
    # Push to main auto-applies. Manual runs apply only when asked.
    if: >
      needs.plan.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.apply == 'true'))
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install talosctl + kubectl
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch $ARCH" >&2; exit 1 ;;
          esac
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          if ! command -v talosctl >/dev/null; then
            curl -sSL -o /tmp/talosctl "https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}/talosctl-${OS}-${ARCH}"
            chmod +x /tmp/talosctl
            sudo mv /tmp/talosctl /usr/local/bin/talosctl || mv /tmp/talosctl "$HOME/talosctl"
            export PATH="$HOME:$PATH"
          fi
          talosctl version --client
          if ! command -v kubectl >/dev/null; then
            curl -sSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/${OS}/${ARCH}/kubectl"
            chmod +x /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl || mv /tmp/kubectl "$HOME/kubectl"
          fi
          kubectl version --client

      - name: Restore cluster credentials
        env:
          TALOS_SECRETS_YAML_B64: ${{ secrets.TALOS_SECRETS_YAML_B64 }}
          TALOSCONFIG_B64: ${{ secrets.TALOSCONFIG_B64 }}
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "${TALOS_SECRETS_YAML_B64:?set TALOS_SECRETS_YAML_B64}" || exit 1
          test -n "${TALOSCONFIG_B64:?set TALOSCONFIG_B64}" || exit 1
          mkdir -p _talos ~/.talos ~/.kube
          echo "$TALOS_SECRETS_YAML_B64" | base64 -d > _talos/secrets.yaml
          echo "$TALOSCONFIG_B64" | base64 -d > ~/.talos/config
          chmod 600 _talos/secrets.yaml ~/.talos/config
          export TALOSCONFIG=~/.talos/config
          if [ -n "${KUBECONFIG_B64:-}" ]; then
            echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
            chmod 600 ~/.kube/config
          fi

      - name: Render machine configs
        run: |
          set -euo pipefail
          export TALOSCONFIG=~/.talos/config
          INV_ENDPOINT=$(python3 -c "import yaml; print(yaml.safe_load(open('talos/nodes.yaml'))['endpoint'])")
          talosctl gen config homelab "$INV_ENDPOINT" \
            --with-secrets _talos/secrets.yaml \
            --config-patch-control-plane @talos/controlplane-patch.yaml \
            --output-dir _talos --force
          # kubeconfig fallback when KUBECONFIG_B64 was not provided
          if [ ! -s ~/.kube/config ]; then
            FIRST_IP=$(python3 -c "import yaml; print(yaml.safe_load(open('talos/nodes.yaml'))['nodes'][0]['ip'])")
            talosctl kubeconfig --force -n "$FIRST_IP"
          fi
          kubectl get nodes -o wide

      - name: Apply one node at a time
        env:
          DRAIN_BEFORE_APPLY: "true"
        run: |
          set -euo pipefail
          export TALOSCONFIG=~/.talos/config
          NODES_TSV=$(python3 -c "
          import yaml
          inv = yaml.safe_load(open('talos/nodes.yaml'))
          ALL = ','.join(n['ip'] for n in inv['nodes'])
          print(ALL)
          for n in inv['nodes']:
              print(f\"{n['ip']}\t{n['name']}\t{n['patch']}\")
          ")
          ALL_IPS=$(echo "$NODES_TSV" | head -n1)
          echo "etcd set: $ALL_IPS"
          talosctl etcd status -n "$ALL_IPS"
          echo "$NODES_TSV" | tail -n +2 | while IFS="$(printf '\t')" read -r IP NAME PATCH; do
            echo "===== $NAME ($IP) patch=$PATCH ====="
            if [ "${DRAIN_BEFORE_APPLY}" = "true" ]; then
              kubectl cordon "$NAME"
              kubectl drain "$NAME" --ignore-daemonsets --delete-emptydir-data --timeout=120s
            fi
            talosctl apply-config -n "$IP" --mode auto \
              --file _talos/controlplane.yaml --config-patch "@talos/$PATCH"
            # Wait for the node to report Ready (covers automatic reboot when the
            # change is disruptive; returns fast when it is not).
            kubectl wait --for=condition=Ready "node/$NAME" --timeout=10m
            kubectl uncordon "$NAME" || true
            talosctl etcd status -n "$ALL_IPS"
            kubectl get nodes -o wide
            echo "----- $NAME done, quorum healthy -----"
          done
