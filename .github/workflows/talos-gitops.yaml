name: talos-gitops

on:
  push:
    branches: [main]
    paths:
      - "talos/**"
  workflow_dispatch:

concurrency:
  group: talos-gitops
  cancel-in-progress: false

jobs:
  apply:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise install
      - env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: topf --topfconfig talos/topf.yaml apply --confirm=false
