name: ArgoCD sync preview

# Static answer to "can ArgoCD even sync this?": on every PR and every push
# to main, lint + render exactly what ArgoCD would render — by reading the
# same Application specs ArgoCD reads (chart path + destination namespace +
# inline helm.values), for prod apps and for the staging ApplicationSet —
# then schema-validate (kubeconform), enforce staging isolation invariants,
# and upload the rendered manifests + a diff summary. No cluster needed.
#
# For a LIVE answer against the real cluster, run locally:
#   argocd app diff <app-name> --local charts/<app>
# (see README "Can ArgoCD sync this?").

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'charts/**'
      - 'argocd/**'
      - '.github/workflows/argocd-preview.yaml'
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'argocd/**'
      - '.github/workflows/argocd-preview.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Helm v3 (final v3, security patches until Feb 2027) — NOT v4: v4 binaries
  # ship only via get.helm.sh, which 404s from GitHub runners, and ArgoCD's
  # in-cluster renderer is Helm-3-based, so v3 is the faithful choice here.
  # Charts use only portable constructs valid on both.
  HELM_VERSION: v3.22.0
  KUBECONFORM_VERSION: v0.6.7
  # Should match (or trail just behind) the cluster's Kubernetes version.
  KUBERNETES_VERSION: 1.30.2

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history so the base-vs-head diff works on PRs.
          fetch-depth: 0

      - name: Install helm + kubeconform
        run: |
          set -euo pipefail
          # Download to files (never pipe curl into tar): a transient CDN
          # error page must fail loudly, not produce "gzip: stdin" noise.
          # The helm sha256 below is pinned for v3.22.0 linux-amd64.
          curl -sSL --fail --retry 3 --retry-all-errors \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" \
            -o /tmp/helm.tar.gz
          echo "1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb  /tmp/helm.tar.gz" | sha256sum -c -
          tar xzf /tmp/helm.tar.gz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -sSL --fail --retry 3 --retry-all-errors \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform.tar.gz
          tar xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          helm version --short
          kubeconform -v

      - name: YAML syntax check (all manifests)
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import glob, sys
          import yaml
          # Chart templates contain Go templating and are not plain YAML —
          # they are validated by `helm lint` + `helm template` below.
          files = sorted(
              f for f in glob.glob('**/*.yaml', recursive=True)
              if '/.git/' not in f'/{f}' and '/templates/' not in f'/{f}'
          )
          errors = 0
          for f in files:
              try:
                  with open(f) as fh:
                      list(yaml.safe_load_all(fh))
              except yaml.YAMLError as e:
                  errors += 1
                  print(f'::error file={f}::YAML parse error: {e}')
          print(f'checked {len(files)} YAML files, {errors} errors')
          sys.exit(1 if errors else 0)
          EOF

      - name: Lint + render + validate (what ArgoCD would sync)
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          python3 - <<'EOF'
          import glob, os, subprocess, sys
          import yaml

          K8S_VERSION = os.environ['KUBERNETES_VERSION']
          SUMMARY = os.environ['GITHUB_STEP_SUMMARY']
          failures = []
          out_lines = ["## ArgoCD sync preview", "", "| Target | Result | Resources |",
                       "|---|---|---|"]

          def sh(cmd, **kw):
              return subprocess.run(cmd, capture_output=True, text=True, **kw)

          def kubeconform(path, label):
              count = sum(1 for line in open(path) if line.startswith('kind: '))
              r = sh(['kubeconform', '-strict', '-ignore-missing-schemas',
                      '-kubernetes-version', K8S_VERSION, '-summary', path])
              print(r.stdout, end='')
              if r.returncode == 0:
                  out_lines.append(f"| {label} | :white_check_mark: valid | {count} |")
              else:
                  print(r.stderr, end='')
                  out_lines.append(f"| {label} | :x: schema invalid | {count} |")
                  failures.append(label)

          def render(release, chart, namespace, values_str, outfile, label):
              # values helper files go to /tmp/vals so the uploaded artifact
              # holds only rendered manifests.
              os.makedirs('/tmp/vals', exist_ok=True)
              cmd = ['helm', 'template', release, chart, '--namespace', namespace]
              if values_str:
                  vals_path = os.path.join('/tmp/vals', os.path.basename(outfile) + '.values.yaml')
                  open(vals_path, 'w').write(values_str)
                  cmd += ['-f', vals_path]
              r = sh(cmd)
              if r.returncode != 0:
                  print(r.stderr, end='')
                  out_lines.append(f"| {label} | :x: helm template failed | 0 |")
                  failures.append(label)
                  return
              open(outfile, 'w').write(r.stdout)
              kubeconform(outfile, label)

          # Every chart must lint clean, standalone.
          for chart in sorted(glob.glob('charts/*/Chart.yaml')):
              r = sh(['helm', 'lint', os.path.dirname(chart)])
              print(r.stdout, end='')
              if r.returncode != 0:
                  print(r.stderr, end='')
                  out_lines.append(f"| lint {os.path.dirname(chart)} | :x: helm lint failed | 0 |")
                  failures.append(f"lint {chart}")

          # Prod: render from the Application specs themselves — same chart,
          # same namespace, same inline helm.values ArgoCD uses.
          for app_file in sorted(glob.glob('argocd/apps/*-app.yaml')):
              app = yaml.safe_load(open(app_file))
              source = (app.get('spec') or {}).get('source') or {}
              if not str(source.get('path', '')).startswith('charts/'):
                  continue
              name = app['metadata']['name']
              ns = (app.get('spec') or {}).get('destination', {}).get('namespace', name)
              values = ((source.get('helm') or {}).get('values'))
              render(name, source['path'], ns, values,
                     f"/tmp/rendered/{name}.yaml", f"prod: {name}")

          # Staging: render from the ApplicationSet template — same charts,
          # same shared helm.values, one shared check namespace (mirrors the
          # shared per-branch namespace design).
          appset = yaml.safe_load(open('argocd/apps/staging-branch-appset.yaml'))
          matrix = appset['spec']['generators'][0]['matrix']['generators']
          elements = next(g['list']['elements'] for g in matrix if 'list' in g)
          staging_values = ((appset['spec']['template']['spec']['source'].get('helm') or {}).get('values'))
          for el in elements:
              render(f"staging-{el['app']}-ci", el['chart'], 'staging-ci-check',
                     staging_values, f"/tmp/rendered/{el['app']}.staging.yaml",
                     f"staging: {el['app']}")

          with open(SUMMARY, 'a') as fh:
              fh.write('\n'.join(out_lines) + '\n')
          print("Rendered manifests uploaded as the `rendered-manifests` artifact.")
          if failures:
              print(f"::error::{len(failures)} target(s) failed — ArgoCD would NOT sync cleanly: {failures}")
              sys.exit(1)
          print("All targets render and validate — ArgoCD should sync cleanly.")
          EOF

      - name: Staging isolation invariants
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import glob, sys
          import yaml

          # Staging renders must NEVER be able to disturb prod:
          # no pinned virtual IPs, no prod/cluster namespaces, no sealed
          # secrets (strict-scoped, undecryptable elsewhere), no LoadBalancer
          # Services, and single replicas.
          PROD_NAMESPACES = {'minecraft', 'v2ray-vpn', 'kube-system', 'argocd', 'default'}
          failures = []

          def docs(path):
              with open(path) as fh:
                  return [d for d in yaml.safe_load_all(fh) if d]

          rendered = sorted(glob.glob('/tmp/rendered/*.staging.yaml'))
          assert rendered, 'no rendered staging charts found'
          for f in rendered:
              for d in docs(f):
                  kind = d.get('kind')
                  name = (d.get('metadata') or {}).get('name')
                  ns = (d.get('metadata') or {}).get('namespace')
                  spec = d.get('spec') or {}
                  if kind == 'SealedSecret':
                      failures.append(f'{f}: SealedSecret {name} must not ship in staging')
                  if ns in PROD_NAMESPACES:
                      failures.append(f'{f}: {kind}/{name} pins prod namespace {ns!r}')
                  if kind == 'Service' and spec.get('type') == 'LoadBalancer':
                      failures.append(f'{f}: Service/{name} is LoadBalancer (staging must be ClusterIP)')
                  if 'loadBalancerIP' in spec:
                      failures.append(f'{f}: Service/{name} pins loadBalancerIP (would steal a prod VIP)')
                  if kind == 'Deployment':
                      replicas = (spec.get('replicas', 1) or 1)
                      if replicas != 1:
                          failures.append(f'{f}: Deployment/{name} replicas={replicas} (staging must be 1)')

          if failures:
              for m in failures:
                  print(f'::error::{m}')
              sys.exit(1)
          print('staging isolation invariants: OK')
          EOF

      - name: What would sync (base vs head)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          echo "### Changed manifests vs \`${{ github.base_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git diff --stat "origin/${{ github.base_ref }}...HEAD" -- charts argocd >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "Full rendered output for this PR is in the \`rendered-manifests\` artifact."
            echo "For a live server-side diff, run locally: \`argocd app diff <app> --local charts/<app>\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: /tmp/rendered/
          if-no-files-found: error
