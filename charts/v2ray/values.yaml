# Neutral defaults — safe to render anywhere. There is deliberately NO
# per-environment branching in this chart: environments inject their specifics
# (e.g. prod's pinned virtual IP) through the Application spec's helm.values.
# The namespace always comes from the release (ArgoCD destination.namespace).
replicaCount: 2

image: v2fly/v2fly-core

service:
  # ClusterIP default; prod pins LoadBalancer + loadBalancerIP via helm.values.
  type: ClusterIP
