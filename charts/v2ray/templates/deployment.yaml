apiVersion: apps/v1
kind: Deployment
metadata:
  name: v2ray
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: v2ray
  template:
    metadata:
      labels:
        app: v2ray
    spec:
      containers:
      - name: v2ray
        image: {{ .Values.image | quote }}
        args:
        - run
        - -c
        - /etc/v2ray/config.json
        volumeMounts:
        - name: v2ray-config
          mountPath: /etc/v2ray/config.json
          subPath: config.json
        stdin: true
        tty: true
      volumes:
      - name: v2ray-config
        secret:
          secretName: v2ray-config
          items:
          - key: config.json
            path: config.json
