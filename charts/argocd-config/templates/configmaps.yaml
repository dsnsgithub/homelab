apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: {{ .Values.namespace }}
  annotations:
    # Created by the Argo CD install; only these keys are managed here.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,ServerSideApply=true
data:
  accounts.github-ci: apiKey
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,ServerSideApply=true
data:
  policy.csv: |
    p, role:github-ci, applications, get, */*, allow
    p, role:github-ci, projects, get, *, allow
    g, github-ci, role:github-ci
