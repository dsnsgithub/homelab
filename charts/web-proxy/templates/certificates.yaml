{{- range .Values.certificates }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
spec:
  secretName: {{ .secretName }}
  dnsNames:
  {{- toYaml .dnsNames | nindent 4 }}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
{{- end }}