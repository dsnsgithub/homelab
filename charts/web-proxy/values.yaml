namespace: web-proxy
createNamespace: true

# Selectorless services backed by EndpointSlices pointing at bare-metal/VMs.
services:
  - name: max-proxy
    port: 80
    targetPort: 80
    endpoints:
      - 10.3.3.218
  - name: code
    port: 7799
    targetPort: 7799
    endpoints:
      - 10.3.3.195
  - name: immich
    port: 2283
    targetPort: 2283
    endpoints:
      - 10.3.3.172

# V2Ray owns its Ingress in v2ray-vpn so NGINX can use its Service directly.
ingressClassName: nginx
ingresses:
  - name: wildcard-mseung-dev
    host: "*.mseung.dev"
    service: max-proxy
    port: 80
    tlsSecret: mseung-wildcard-tls
  - name: wildcard-seung-dev
    host: "*.seung.dev"
    service: max-proxy
    port: 80
    tlsSecret: seung-wildcard-tls
  - name: code-dsns-dev
    host: code.dsns.dev
    service: code
    port: 7799
    tlsSecret: dsns-wildcard-tls
    annotations:
      nginx.org/proxy-read-timeout: "3600s"
      nginx.org/proxy-send-timeout: "3600s"
  - name: immich-dsns-dev
    host: immich.dsns.dev
    service: immich
    port: 2283
    tlsSecret: dsns-wildcard-tls
    annotations:
      nginx.org/proxy-read-timeout: "3600s"
      nginx.org/proxy-send-timeout: "3600s"

certificates:
  - name: wildcard-dsns-dev
    secretName: dsns-wildcard-tls
    dnsNames:
      - dsns.dev
      - "*.dsns.dev"
  - name: wildcard-mseung-dev
    secretName: mseung-wildcard-tls
    dnsNames:
      - mseung.dev
      - "*.mseung.dev"
  - name: wildcard-seung-dev
    secretName: seung-wildcard-tls
    dnsNames:
      - seung.dev
      - "*.seung.dev"
