namespace: cert-manager
createNamespace: true

issuer:
  name: letsencrypt-prod
  email: dominic@seung.dev
  server: https://acme-v02.api.letsencrypt.org/directory
  privateKeySecretRef:
    name: letsencrypt-prod-key
  cloudflareApiTokenSecretRef:
    name: cloudflare-api-token
    key: api-token

sealedSecret:
  # Template only - DO NOT commit a real secret here.
  # Re-seal the Cloudflare API token and paste the output into encryptedData:
  #   kubeseal --format yaml --controller-name sealed-secrets-controller \
  #     --controller-namespace kube-system < cloudflare.plain.yaml | grep -A1 'api-token:'
  encryptedData:
    api-token: 