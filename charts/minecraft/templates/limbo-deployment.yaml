apiVersion: apps/v1
kind: Deployment
metadata:
  name: limbo
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  minReadySeconds: 10
  selector:
    matchLabels:
      app: limbo
  template:
    metadata:
      labels:
        app: limbo
    spec:
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: limbo
        matchLabelKeys:
        - pod-template-hash
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
      initContainers:
      - name: download-schematic
        image: "{{ .Values.initContainers.downloadImage.repository }}:{{ .Values.initContainers.downloadImage.tag }}"
        command: ['sh', '-c', 'wget -O /data/spawn.schem {{ .Values.limbo.schematicURL }}']
        resources:
          {{- toYaml .Values.initContainers.resources | nindent 10 }}
        volumeMounts:
        - name: limbo-data
          mountPath: /data
      containers:
      - name: limbo
        image: "{{ .Values.limbo.image.repository }}:{{ .Values.limbo.image.tag }}"
        env:
        - name: VELOCITY_FORWARDING_SECRET
          valueFrom:
            secretKeyRef:
              name: velocity-forwarding-secret
              key: forwarding.secret
        ports:
        - containerPort: {{ .Values.limbo.port }}
          name: minecraft
        readinessProbe:
          tcpSocket:
            port: minecraft
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: minecraft
          periodSeconds: 20
        resources:
          {{- toYaml .Values.limbo.resources | nindent 10 }}
        volumeMounts:
        - name: limbo-config
          mountPath: /usr/src/app/server.toml
          subPath: server.toml
        - name: limbo-data
          mountPath: /usr/src/app/spawn.schem
          subPath: spawn.schem
        stdin: true
        tty: true
      volumes:
      - name: limbo-config
        configMap:
          name: velocity-config
          items:
          - key: server.toml
            path: server.toml
      - name: limbo-data
        emptyDir: {}
