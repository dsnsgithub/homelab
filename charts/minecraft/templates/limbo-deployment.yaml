apiVersion: apps/v1
kind: Deployment
metadata:
  name: limbo
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: limbo
  template:
    metadata:
      labels:
        app: limbo
    spec:
      initContainers:
      - name: download-schematic
        image: alpine:latest
        command: ['sh', '-c', 'wget -O /data/spawn.schem https://github.com/LOOHP/Limbo/raw/refs/heads/master/spawn.schem']
        volumeMounts:
        - name: limbo-data
          mountPath: /data
      containers:
      - name: limbo
        image: {{ .Values.limbo.image }}
        env:
        - name: VELOCITY_FORWARDING_SECRET
          valueFrom:
            secretKeyRef:
              name: velocity-forwarding-secret
              key: forwarding.secret
        volumeMounts:
        - name: limbo-config
          mountPath: /usr/src/app/server.toml
          subPath: server.toml
        - name: limbo-data
          mountPath: /usr/src/app/spawn.schem
          subPath: spawn.schem
        stdin: true
        tty: true
      volumes:
      - name: limbo-config
        configMap:
          name: velocity-config
          items:
          - key: server.toml
            path: server.toml
      - name: limbo-data
        emptyDir: {}