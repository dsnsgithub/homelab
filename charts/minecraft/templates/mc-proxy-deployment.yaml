apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-proxy
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  minReadySeconds: 10
  selector:
    matchLabels:
      app: mc-proxy
  template:
    metadata:
      labels:
        app: mc-proxy
    spec:
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: mc-proxy
        matchLabelKeys:
        - pod-template-hash
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
      initContainers:
      - name: init-configs
        image: "{{ .Values.initContainers.configImage.repository }}:{{ .Values.initContainers.configImage.tag }}"
        command: ['sh', '-c', 'cp /config-template/velocity.toml /server/velocity.toml && cp /forwarding-secret/forwarding.secret /server/forwarding.secret']
        resources:
          {{- toYaml .Values.initContainers.resources | nindent 10 }}
        volumeMounts:
        - name: server-data
          mountPath: /server
        - name: velocity-config-template
          mountPath: /config-template
        - name: forwarding-secret
          mountPath: /forwarding-secret
      containers:
      - name: proxy
        image: "{{ .Values.mcProxy.image.repository }}:{{ .Values.mcProxy.image.tag }}"
        env:
        - name: TYPE
          value: {{ .Values.mcProxy.env.TYPE | quote }}
        - name: VELOCITY_VERSION
          value: {{ .Values.mcProxy.env.VELOCITY_VERSION | quote }}
        - name: VELOCITY_BUILD_ID
          value: {{ .Values.mcProxy.env.VELOCITY_BUILD_ID | quote }}
        - name: MEMORY
          value: {{ .Values.mcProxy.env.MEMORY | quote }}
        - name: MINECRAFT_VERSION
          value: {{ .Values.mcProxy.env.MINECRAFT_VERSION | quote }}
        - name: MODRINTH_PROJECTS
          value: |
            {{- range .Values.mcProxy.env.MODRINTH_PROJECTS }}
            {{ . }}
            {{- end }}
        ports:
        - containerPort: {{ .Values.mcProxy.port }}
          name: velocity
        - containerPort: {{ .Values.mcProxy.port }}
          protocol: UDP
          name: voice-chat
        # Startup downloads Velocity and plugins.
        startupProbe:
          tcpSocket:
            port: velocity
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: velocity
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: velocity
          periodSeconds: 20
        resources:
          {{- toYaml .Values.mcProxy.resources | nindent 10 }}
        volumeMounts:
        - name: server-data
          mountPath: /server
        stdin: true
        tty: true
      volumes:
      - name: server-data
        emptyDir: {}
      - name: velocity-config-template
        configMap:
          name: velocity-config
          items:
          - key: velocity.toml
            path: velocity.toml
      - name: forwarding-secret
        secret:
          secretName: velocity-forwarding-secret
          items:
          - key: forwarding.secret
            path: forwarding.secret
