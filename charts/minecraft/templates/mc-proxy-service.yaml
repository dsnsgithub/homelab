apiVersion: v1
kind: Service
metadata:
  name: mc-proxy-service
spec:
  type: {{ .Values.proxy.service.type }}
  {{- if .Values.proxy.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.proxy.service.loadBalancerIP }}
  {{- end }}
  selector:
    app: mc-proxy
  ports:
  - name: minecraft
    port: 25565
    targetPort: 25577
  - name: voice-chat
    port: 25577
    protocol: UDP
    targetPort: 25577
