apiVersion: v1
kind: Service
metadata:
  name: mc-proxy-service
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  # kube-vip only announces the VIP from nodes running an mc-proxy pod.
  externalTrafficPolicy: Local
  {{- end }}
  selector:
    app: mc-proxy
  ports:
  - name: minecraft
    port: {{ .Values.service.mcProxyPort }}
    targetPort: {{ .Values.mcProxy.port }}
  - name: voice-chat
    port: {{ .Values.service.voiceChatPort }}
    protocol: UDP
    targetPort: {{ .Values.mcProxy.port }}
