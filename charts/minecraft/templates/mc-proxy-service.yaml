apiVersion: v1
kind: Service
metadata:
  name: mc-proxy-service
  namespace: {{ .Values.namespace }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  labels:
    homelab.dsns.dev/load-balancer: cilium
  annotations:
    lbipam.cilium.io/ips: {{ .Values.service.loadBalancerIP | quote }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  externalTrafficPolicy: Cluster
  {{- end }}
  selector:
    app: mc-proxy
  ports:
  - name: minecraft
    port: {{ .Values.service.mcProxyPort }}
    targetPort: {{ .Values.mcProxy.port }}
  - name: voice-chat
    port: {{ .Values.service.voiceChatPort }}
    protocol: UDP
    targetPort: {{ .Values.mcProxy.port }}
