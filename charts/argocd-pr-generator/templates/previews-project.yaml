apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: previews
  namespace: {{ .Values.namespace }}
spec:
  description: PR previews. Namespaced resources in *-pr-* namespaces only.
  sourceRepos:
    - https://github.com/dsnsgithub/homelab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*-pr-*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: "*-pr-*"
